name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Prepare data
        run: python -m src.data_prep

      - name: Run tests
        run: pytest tests/ -v

      - name: Train model (reproductibility check)
        run: python -m src.train
    docker:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - name: Build image
          run: docker build -t pret-banque .
